<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Gestión Culinaria</title>
    <link rel="stylesheet" href="ADMIN/styles.css">
    <style>
        .avatar-opciones {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .avatar-opciones label {
            cursor: pointer;
            text-align: center;
        }

        .avatar-opciones input[type="radio"] {
            display: none;
        }

        .avatar-circulo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background-color: var(--fondo);
            border: 2px solid var(--borde);
            transition: 0.3s;
        }

        .avatar-opciones input[type="radio"]:checked+.avatar-circulo {
            border-color: var(--morado-oscuro);
            background-color: var(--morado-claro);
            color: white;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <header class="encabezado">
            <h1 style="color: var(--morado-oscuro); margin: 0;">Editar Mi Perfil</h1>
            <nav class="nav-enlaces">
                <a href="#" id="btnVolver">Volver al Dashboard</a>
            </nav>
        </header>

        <main>
            <div class="bloque" style="max-width: 600px; margin: 40px auto;">
                <form id="formPerfil">

                    <div class="form-group">
                        <label>Elige tu Avatar</label>
                        <div class="avatar-opciones">
                            <label><input type="radio" name="avatar" value="👨‍🍳" checked>
                                <div class="avatar-circulo">👨‍🍳</div>
                            </label>
                            <label><input type="radio" name="avatar" value="👩‍🍳">
                                <div class="avatar-circulo">👩‍🍳</div>
                            </label>
                            <label><input type="radio" name="avatar" value="🍕">
                                <div class="avatar-circulo">🍕</div>
                            </label>
                            <label><input type="radio" name="avatar" value="🥗">
                                <div class="avatar-circulo">🥗</div>
                            </label>
                            <label><input type="radio" name="avatar" value="🔥">
                                <div class="avatar-circulo">🔥</div>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="perfilNombre">Nombre de Usuario</label>
                        <input type="text" id="perfilNombre" required>
                    </div>

                    <div class="form-group">
                        <label for="perfilDescripcion">Descripción / Biografía</label>
                        <textarea id="perfilDescripcion" rows="3"
                            style="width: 100%; padding: 10px; border: 1px solid var(--borde); border-radius: 8px; font-family: inherit;"
                            placeholder="Cuéntanos un poco sobre ti..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="perfilIntereses">Intereses Culinarios</label>
                        <input type="text" id="perfilIntereses" placeholder="Ej: Comida italiana, Postres, Parrilla...">
                    </div>

                    <button type="submit" class="boton boton-principal" style="width: 100%; margin-top: 16px;">Guardar
                        Cambios</button>
                </form>
            </div>
        </main>
    </div>
    <script src="JS/perfil.js"></script>
</body>

</html>
