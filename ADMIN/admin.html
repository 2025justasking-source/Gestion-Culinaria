<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Usuarios</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <div class="contenedor">
        <header class="encabezado">
            <h1 style="color: var(--morado-oscuro);">Gestión de Usuarios</h1>
            <nav class="nav-enlaces">
                <a href="../index_admin.html">Volver al Inicio</a>
            </nav>
        </header>

        <main>
            <div class="barra-busqueda">
                <div class="filtros" style="display: flex; gap: 10px;">
                    <input type="text" id="buscadorUsuarios" placeholder="Buscar por nombre..." class="form-group"
                        style="margin: 0; padding: 8px;">
                    <!-- NUEVO: Filtro por Rol -->
                    <select id="filtroRol" class="form-group" style="margin: 0; padding: 8px;">
                        <option value="Todos">Todos los roles</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Chef">Chef</option>
                        <option value="Usuario">Usuario</option>
                    </select>
                </div>
                <a href="#modalCrear" class="boton boton-principal">Añadir Usuario Nuevo</a>
            </div>

            <div class="bloque table-responsive">
                <table class="tabla-admin">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuariosCuerpo">
                        <!-- Las filas se renderizarán dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </main>

        <!-- crear usuario -->
        <div id="modalCrear" class="modal-css">
            <div class="modal-contenido">
                <a href="#" class="cerrar-modal">&times;</a>
                <h2 style="color: var(--morado-oscuro); margin-top: 0;">Nuevo Usuario</h2>
                <form id="formCrearUsuario">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <input type="text" id="nuevoNombre" required>
                    </div>
                    <div class="form-group">
                        <label>Correo Electrónico</label>
                        <input type="email" id="nuevoCorreo" required>
                    </div>
                    <div class="form-group">
                        <label>Rol</label>
                        <select id="nuevoRol" required>
                            <option value="Administrador">Administrador</option>
                            <option value="Chef">Chef</option>
                            <option value="Usuario">Usuario</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <a href="#" class="boton">Cancelar</a>
                        <button type="submit" class="boton boton-principal">Guardar Usuario</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Cambiar Rol -->
        <div id="modalRol" class="modal-css">
            <div class="modal-contenido">
                <a href="#" class="cerrar-modal">&times;</a>
                <h2 style="color: var(--morado-oscuro); margin-top: 0;">Cambiar Rol</h2>
                <form id="formCambiarRol">
                    <div class="form-group">
                        <label>Seleccione el nuevo rol</label>
                        <select id="selectNuevoRol" required>
                            <option value="Administrador">Administrador</option>
                            <option value="Chef">Chef</option>
                            <option value="Usuario">Usuario</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <a href="#" class="boton">Cancelar</a>
                        <button type="submit" class="boton boton-principal">Actualizar Rol</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Banear -->
        <div id="modalBan" class="modal-css">
            <div class="modal-contenido">
                <a href="#" class="cerrar-modal">&times;</a>
                <h2 style="color: #c5221f; margin-top: 0;">Suspender Usuario</h2>
                <form id="formBanearUsuario">
                    <div class="form-group">
                        <label>Periodo de Suspensión</label>
                        <select id="selectTiempoBan" required>
                            <option value="24 Horas">24 Horas</option>
                            <option value="3 Días">3 Días</option>
                            <option value="1 Semana">1 Semana</option>
                            <option value="Indefinido">Baneo Indefinido</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <a href="#" class="boton">Cancelar</a>
                        <button type="submit" class="boton"
                            style="background-color: #c5221f; color: white; border: none;">Aplicar Sanción</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
    <script src="../JS/admin.js"></script>
</body>

</html>
